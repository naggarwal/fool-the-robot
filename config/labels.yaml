# Object vocabulary for CLIP zero-shot classification.
# `display: true`  -> shown as a guess in the UI.
# `display: false` -> anchor/rejection label; absorbs probability mass for
#                     "none of the above", never shown. See PRD 5.2b.
#
# Each entry's CLIP text prompt is built as: "a photo of {prompt}".
# Near-neighbor sets (shoe family, ball family) are intentional — they make
# confusion easy and instructive.

display:
  # footwear near-neighbor set (intentional confusers)
  - {label: "sneaker",        prompt: "a sneaker"}
  - {label: "dress shoe",     prompt: "a dress shoe"}
  - {label: "boot",           prompt: "a boot"}
  - {label: "sandal",         prompt: "a sandal"}
  # fruit / food
  - {label: "banana",         prompt: "a banana"}
  - {label: "apple",          prompt: "an apple"}
  - {label: "orange",         prompt: "an orange"}
  - {label: "corn cob",       prompt: "a corn cob"}
  # ball near-neighbor set
  - {label: "soccer ball",    prompt: "a soccer ball"}
  - {label: "basketball",     prompt: "a basketball"}
  - {label: "tennis ball",    prompt: "a tennis ball"}
  - {label: "baseball",       prompt: "a baseball"}
  # everyday kid objects
  - {label: "water bottle",   prompt: "a water bottle"}
  - {label: "backpack",       prompt: "a backpack"}
  - {label: "hat",            prompt: "a hat"}
  - {label: "baseball cap",   prompt: "a baseball cap"}
  - {label: "phone",          prompt: "a smartphone"}
  - {label: "book",           prompt: "a book"}
  - {label: "pencil",         prompt: "a pencil"}
  - {label: "pen",            prompt: "a pen"}
  - {label: "marker",         prompt: "a marker pen"}
  - {label: "crayon",         prompt: "a crayon"}
  - {label: "scissors",       prompt: "a pair of scissors"}
  - {label: "glue stick",     prompt: "a glue stick"}
  - {label: "eraser",         prompt: "an eraser"}
  - {label: "ruler",          prompt: "a ruler"}
  - {label: "sunglasses",     prompt: "a pair of sunglasses"}
  - {label: "glasses",        prompt: "a pair of eyeglasses"}
  - {label: "LEGO brick",     prompt: "a LEGO brick"}
  - {label: "stuffed animal", prompt: "a stuffed animal toy"}
  - {label: "toy car",        prompt: "a toy car"}
  - {label: "key",            prompt: "a key"}
  - {label: "coin",           prompt: "a coin"}
  - {label: "glove",          prompt: "a glove"}
  - {label: "sock",           prompt: "a sock"}
  - {label: "umbrella",       prompt: "an umbrella"}
  - {label: "headphones",     prompt: "a pair of headphones"}
  - {label: "mug",            prompt: "a coffee mug"}
  - {label: "spoon",          prompt: "a spoon"}
  - {label: "fork",           prompt: "a fork"}
  - {label: "toothbrush",     prompt: "a toothbrush"}
  - {label: "toy banana",     prompt: "a toy banana"}

  # ===================================================================== #
  # Added 2026-07-26 (+48). Rationale: a child's own object had roughly even
  # odds of falling outside the original 42, which stalled throughput on "I
  # have no idea" rather than producing a teachable fool. These are the things
  # a 6-12 year old actually has in a pocket at a community centre, plus what
  # the accompanying adult is carrying.
  #
  # NOTE: adding labels lowers every top-1 percentage (they all share one
  # softmax denominator) and multiplies the voice cache by label count.
  # Re-run scripts/calibrate.py before the event.
  # ===================================================================== #

  # --- kid pocket / backpack items ---
  - {label: "fidget spinner", prompt: "a fidget spinner"}
  - {label: "trading card",   prompt: "a trading card"}
  - {label: "playing card",   prompt: "a playing card"}
  - {label: "sticker",        prompt: "a sticker"}
  - {label: "hair tie",       prompt: "a hair elastic tie"}
  - {label: "rubber band",    prompt: "a rubber band"}
  - {label: "bottle cap",     prompt: "a plastic bottle cap"}
  - {label: "slime",          prompt: "a blob of toy slime"}
  - {label: "LEGO minifigure",prompt: "a LEGO minifigure"}
  - {label: "bracelet",       prompt: "a beaded bracelet"}
  - {label: "marble",         prompt: "a glass marble"}
  - {label: "bouncy ball",    prompt: "a small rubber bouncy ball"}
  - {label: "yo-yo",          prompt: "a yo-yo"}
  - {label: "keychain",       prompt: "a keychain"}
  - {label: "pencil case",    prompt: "a pencil case"}
  - {label: "notebook",       prompt: "a spiral notebook"}
  - {label: "toy dinosaur",   prompt: "a toy dinosaur"}
  - {label: "action figure",  prompt: "an action figure"}
  - {label: "dice",           prompt: "a pair of dice"}
  - {label: "jump rope",      prompt: "a jump rope"}
  - {label: "whistle",        prompt: "a whistle"}

  # --- adult pocket / bag items ---
  - {label: "wallet",         prompt: "a wallet"}
  - {label: "purse",          prompt: "a purse"}
  - {label: "tote bag",       prompt: "a tote bag"}
  - {label: "dollar bill",    prompt: "a dollar bill"}
  - {label: "credit card",    prompt: "a credit card"}
  - {label: "business card",  prompt: "a business card"}
  - {label: "car key",        prompt: "a car key fob"}
  - {label: "lanyard",        prompt: "a lanyard"}
  - {label: "watch",          prompt: "a wristwatch"}
  - {label: "ring",           prompt: "a finger ring"}
  - {label: "necklace",       prompt: "a necklace"}
  - {label: "earbuds",        prompt: "a pair of wireless earbuds"}
  - {label: "tablet",         prompt: "a tablet computer"}
  - {label: "remote control", prompt: "a TV remote control"}
  - {label: "computer mouse", prompt: "a computer mouse"}
  - {label: "charger cable",  prompt: "a charging cable"}
  - {label: "calculator",     prompt: "a calculator"}
  - {label: "hand sanitizer", prompt: "a bottle of hand sanitizer"}
  - {label: "lip balm",       prompt: "a tube of lip balm"}
  - {label: "comb",           prompt: "a comb"}

  # --- deliberate near-neighbour confusers for the sets above ---
  # (coffee cup/travel mug vs mug; highlighter vs marker/pen; mitten vs glove;
  #  slipper/flip flop vs sandal/sneaker; paper clip vs coin/key.)
  - {label: "coffee cup",     prompt: "a paper coffee cup"}
  - {label: "travel mug",     prompt: "a travel mug"}
  - {label: "highlighter",    prompt: "a highlighter pen"}
  - {label: "mitten",         prompt: "a mitten"}
  - {label: "slipper",        prompt: "a slipper"}
  - {label: "flip flop",      prompt: "a flip flop sandal"}
  - {label: "paper clip",     prompt: "a paper clip"}

# Anchor / rejection labels — never displayed. Probability mass here is the
# model's implicit "none of the above." Keeps confident-wrong answers down.
anchors:
  - {prompt: "a random object"}
  - {prompt: "an unidentifiable thing"}
  - {prompt: "a blurry photo"}
  - {prompt: "a close-up of a texture"}
  - {prompt: "a person's hand"}
  - {prompt: "a piece of clothing"}
  - {prompt: "an empty background"}
  - {prompt: "a wall"}
  - {prompt: "a messy pile of things"}
  - {prompt: "something unusual"}
